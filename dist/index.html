<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ИГРА. 1917.">
  <title>ИГРА · 1917</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="on">
      <span class="eyebrow">1917</span><h1>ИГРА</h1>
      <label for="login-username">Логин</label>
      <input id="login-username" name="username" autocomplete="username" required>
      <label for="login-password">Пароль</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
      <button class="gold-button" type="submit">Войти</button>
    </form>
  </main>
  <div id="application" hidden>
    <div class="facade-fractures" aria-hidden="true"></div>
    <div class="site-shell">
      <header class="masthead">
        <button class="brand" data-view="house" aria-label="ИГРА — главная"><span class="brand-mark">И</span><span>ИГРА<small>1917</small></span></button>
        <div class="day-mark"><strong id="day-title"></strong><select id="day-select" aria-label="Текущая ночь" hidden></select><span id="day-date"></span></div>
        <div class="role-panel">
          <button id="identity-button" class="identity-button">Игрок 1</button>
          <div class="role-switch" role="group" aria-label="Режим">
            <button data-role="player" aria-pressed="true">Игрок</button>
            <button data-role="gm" aria-pressed="false">Ведущий</button>
            <button data-role="spectator" id="spectator-role" aria-pressed="false" hidden>Зритель</button>
          </div>
        </div>
      </header>
      <nav class="main-nav" aria-label="Разделы игры">
        <button data-view="house">Особняк</button>
        <button data-view="roster">Игроки</button>
        <button data-view="sheet">Мой персонаж</button>
        <button data-view="npcs" hidden>Действующие лица</button>
        <button data-view="journal">Журнал бросков</button>
      </nav>
      <main id="content"></main>
    </div>
    <dialog id="detail" aria-labelledby="detail-title"><button class="close" aria-label="Закрыть окно">×</button><div id="detail-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="app.js?v=6"></script>
</body>
</html>
